name: Build and deploy PES viewer

on:
  push:
    branches: [main]
    paths:
      - "pes-field-mapping-workbook.xlsx"
      - "scripts/**"
      - "template/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openpyxl

      - name: Convert workbook to data.json
        run: |
          mkdir -p dist
          python scripts/xlsx_to_json.py pes-field-mapping-workbook.xlsx dist/data.json

      - name: Assemble site
        run: cp template/index.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
