<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PES — Field Mapping, Permissions & Files</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1a1a18;--muted:#6b6b63;--line:#e2e2dc;--accent:#1f3864;--yes:#137a4a;--yesbg:#e3f5ec;--no:#9a9a92;--warn:#9c5700;--warnbg:#fdf0d5;--ghost:#b9b9b2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#1f1f23;--ink:#ececea;--muted:#9a9a93;--line:#33333a;--accent:#8fb0e8;--yes:#5fd39b;--yesbg:#12352a;--no:#6a6a72;--warn:#f0c987;--warnbg:#3a2e16;--ghost:#55555d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.wrap{display:flex}
aside{width:236px;flex:0 0 236px;border-right:1px solid var(--line);padding:12px 10px 40px;max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:0}
main{flex:1;min-width:0;padding:14px 16px 60px}
.sec{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 6px 4px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:5px 8px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.nav button:hover{background:var(--line)}
.nav button.on{background:var(--accent);color:#fff}
.nav button.ghost{color:var(--ghost)}
.nav .cnt{float:right;color:var(--muted);font-size:11px}
.nav button.on .cnt{color:#fff}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.tbtn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input[type=search]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px}
input[type=search]{min-width:200px;flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:var(--bg)}
td.f{font-weight:600;min-width:170px}
td.k{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);word-break:break-all}
.y{color:var(--yes);background:var(--yesbg);border-radius:5px;padding:1px 6px;font-weight:600;font-size:12px}
.n{color:var(--no);font-size:12px}
.miss{color:var(--warn);background:var(--warnbg);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600}
.muted{color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media(max-width:820px){.wrap{display:block}aside{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);position:static;max-height:none}}
</style></head><body>
<header><h1>PES — Field Mapping, Permissions &amp; Files</h1>
<div class="sub" id="hsub">Loading data.json…</div></header>
<div class="wrap"><aside><div class="nav" id="nav"></div></aside><main>
<div class="tabs" id="tabs"></div>
<div class="toolbar"><span class="pill" id="mode">Static build — edit the Excel file to change data</span><button id="dl" class="tbtn">Download CSV</button></div>
<div class="bar">
<input type="search" id="q" placeholder="Search field, Kobo path, question, condition…">
<select id="act"></select><select id="st"></select><select id="ch"></select>
<select id="sub"></select><select id="role"></select><select id="cov"></select>
</div>
<div class="stats" id="stats"></div>
<div class="scroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="empty" id="empty" style="display:none">No rows for this module yet.</div>
</main></div>
<script>
const el=id=>document.getElementById(id), splitv=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
let DATA=null,ROLES=[],ROLE_SETS={},MODULES=[],R=[],FILES=[],view='mapping',mod=null,sec=null,subf=null;
function uniq(f){return [...new Set(R.flatMap(f))].filter(Boolean).sort()}
function fill(s,l,o,cur){s.innerHTML='<option value="">'+l+'</option>'+o.map(x=>`<option ${x===cur?'selected':''}>${x}</option>`).join('')}
function covOf(r){if(r.cov)return r.cov;return r.sec==='Form Actions'?'N/A (action)':(r.kf?'Mapped':'MISSING')}
function curRoles(){return ROLE_SETS[mod]||ROLES}
fetch('data.json').then(r=>r.json()).then(d=>{
  DATA=d; ROLES=d.roles; ROLE_SETS=d.role_sets||{}; MODULES=d.modules;
  R=d.rows.map((r,i)=>({...r,i:i+1,cov:covOf(r)}));
  FILES=d.files;
  mod=MODULES.find(m=>R.some(r=>r.mod===m))||MODULES[0];
  el('hsub').textContent=R.length+' field/action rows across '+MODULES.length+' modules · built from the workbook';
  fill(el('cov'),'All mapping states',['Mapped','Derived','MISSING','N/A (action)']);
  el('tabs').innerHTML=[['mapping','Field Mapping'],['perm','Permissions'],['files','Files']].map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
  el('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;refillDependent();draw()});
  ['q','act','st','ch','role','cov'].forEach(id=>el(id).addEventListener('input',draw));
  el('sub').addEventListener('input',()=>{subf=el('sub').value||null;draw()});
  refillDependent();
  drawNav(); draw();
}).catch(e=>{el('hsub').textContent='Could not load data.json: '+e});

// sub-section and role options depend on the current module (and, for
// sub-section, the current section) so they refresh whenever those change
function refillDependent(){
  const inMod=R.filter(r=>r.mod===mod);
  const keep=(sel,list)=>list.includes(el(sel).value)?el(sel).value:null;
  const a0=keep('act',uniq2(inMod,r=>splitv(r.act))), s0=keep('st',uniq2(inMod,r=>splitv(r.st))), c0=keep('ch',uniq2(inMod,r=>[r.ch]));
  fill(el('act'),'All activity types',uniq2(inMod,r=>splitv(r.act)),a0);
  fill(el('st'),'All statuses',uniq2(inMod,r=>splitv(r.st)),s0);
  fill(el('ch'),'All chains',uniq2(inMod,r=>[r.ch]),c0);
  const subs=[...new Set(inMod.filter(r=>!sec||r.sec===sec).map(r=>r.sub))].filter(Boolean).sort();
  const keepSub=subs.includes(subf)?subf:null; subf=keepSub;
  fill(el('sub'),'All sub sections',subs,subf);
  fill(el('role'),'Any role',curRoles());
}
function uniq2(list,f){return [...new Set(list.flatMap(f))].filter(Boolean).sort()}
function drawNav(){
  const mc={}; R.forEach(r=>mc[r.mod]=(mc[r.mod]||0)+1);
  let h='<div class="sec">Module tabs</div>';
  MODULES.forEach(m=>{const n=mc[m]||0;h+=`<button class="${mod===m?'on':''}${n?'':' ghost'}" data-m="${m}">${m}<span class="cnt">${n||'empty'}</span></button>`});
  const sc={}; R.filter(r=>r.mod===mod).forEach(r=>sc[r.sec]=(sc[r.sec]||0)+1);
  h+='<div class="sec">Section</div><button class="'+(sec?'':'on')+'" data-s="">All sections</button>';
  Object.keys(sc).forEach(s=>h+=`<button class="${sec===s?'on':''}" data-s="${s}">${s}<span class="cnt">${sc[s]}</span></button>`);
  el('nav').innerHTML=h;
  el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if('m' in b.dataset){mod=b.dataset.m;sec=null;subf=null}else{sec=b.dataset.s||null;subf=null}
    drawNav();refillDependent();draw()});
}
function filtered(){const q=el('q').value.toLowerCase(),a=el('act').value,s=el('st').value,c=el('ch').value,ro=el('role').value,cv=el('cov').value;
  const roles=curRoles();
  return R.filter(r=>r.mod===mod&&(!sec||r.sec===sec)&&(!subf||r.sub===subf)
    &&(!a||r.act==='Any'||splitv(r.act).includes(a))
    &&(!s||r.st==='All'||splitv(r.st).includes(s))
    &&(!c||r.ch==='both'||r.ch===c)
    &&(!ro||r.roles[roles.indexOf(ro)]==='Yes')
    &&(!cv||r.cov===cv)
    &&(!q||(r.f+r.sub+r.kf+r.kq+r.hide+r.st).toLowerCase().includes(q)))}
const cell=v=>v==='Yes'?'<span class="y">Yes</span>':v==='No'?'<span class="n">No</span>':'<span class="n">—</span>';
const covtag=c=>c==='MISSING'?'<span class="miss">MISSING</span>':c==='Mapped'?'<span class="y">Mapped</span>':'<span class="n">'+c+'</span>';
function draw(){
  const rows=filtered(), t=el('tbl'), tb=t.tBodies[0]||t.createTBody();
  let head,body,stats;
  if(view==='files'){
    const fr=FILES.filter(f=>f.mod===mod);
    head=['File / Document','Activity Type','Required','Multiple','Backend Key'];
    body=fr.map(f=>`<tr><td class="f">${f.name}</td><td class="muted">${f.act}</td><td>${cell(f.req)}</td><td>${cell(f.multi)}</td><td class="k">${f.key||'<span class="miss">not set</span>'}</td></tr>`);
    stats=[['Files',fr.length],['Required',fr.filter(f=>f.req==='Yes').length],['No backend key',fr.filter(f=>!f.key).length]];
  }else if(view==='mapping'){
    head=['Field / Action','Section','Sub section','Kobo field name','Kobo question','Hide condition / Notes','Mapping'];
    body=rows.map(r=>`<tr><td class="f">${r.f}</td><td class="muted">${r.sec}</td><td class="muted">${r.sub}</td><td class="k">${r.kf||''}</td><td class="muted">${r.kq||''}</td><td class="muted">${r.hide||''}</td><td>${covtag(r.cov)}</td></tr>`);
    stats=[['Mapping rows',rows.length],['Mapped',rows.filter(r=>r.cov==='Mapped').length],['Missing',rows.filter(r=>r.cov==='MISSING').length],['Derived',rows.filter(r=>r.cov==='Derived').length]];
  }else{
    const roles=curRoles();
    head=['Field / Action','Sub section','Activity','Status','Chain',...roles.map(x=>x.trim().replace('Super admin','SA').replace('Data Admin','DA').replace('Manger','Mgr').replace(/^Agg\s*admin$/,'Agg Adm').replace(/^Impl\s*admin$/,'Impl Adm'))];
    body=rows.map(r=>`<tr><td class="f">${r.f}</td><td class="muted">${r.sub}</td><td class="muted">${r.act}</td><td class="muted">${r.st}</td><td class="muted">${r.ch}</td>${r.roles.map(v=>'<td>'+cell(v)+'</td>').join('')}</tr>`);
    stats=[['Rows',rows.length],['Sections',new Set(rows.map(r=>r.sec)).size],['Statuses',new Set(rows.map(r=>r.st)).size]];
  }
  el('stats').innerHTML=stats.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  t.tHead.innerHTML='<tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>';
  tb.innerHTML=body.join('');
  el('empty').style.display=body.length?'none':'block';
  el('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelector('.bar').style.display=view==='files'?'none':'flex';
}
el('dl').onclick=()=>{
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  let csv;
  if(view==='files'){csv=['File','Activity Type','Required','Multiple','Backend Key'].map(esc).join(',')+'\n'+
    FILES.filter(f=>f.mod===mod).map(f=>[f.name,f.act,f.req,f.multi,f.key].map(esc).join(',')).join('\n');}
  else{const roles=curRoles();csv=['Module','Field / Action','Section','Sub section','Activity','Status','Chain',...roles,'Kobo field','Kobo question','Hide condition','Coverage'].map(esc).join(',')+'\n'+
    filtered().map(r=>[r.mod,r.f,r.sec,r.sub,r.act,r.st,r.ch,...r.roles,r.kf,r.kq,r.hide,r.cov].map(esc).join(',')).join('\n');}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=(mod||'export').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()+'-'+view+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
</script></body></html>
